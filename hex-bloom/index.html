// camera

  var tt = function (fn) { return function (e) { e.preventDefault(); for (var i = 0; i < e.changedTouches.length; i++) { var t = e.changedTouches[i]; fn({ clientX: t.clientX, clientY: t.clientY, pointerId: t.identifier + 1 }); } }; };
  uic.addEventListener('touchstart', tt(onDown), { passive: false }); uic.addEventListener('touchmove', tt(onMove), { passive: false }); uic.addEventListener('touchend', tt(onUp), { passive: false });
}

// ───────────────────────── frame ─────────────────────────
var lastT = 0, fps = 60, dbgEl = document.getElementById('dbg'), dbgT = 0;
function update(dt) {
  var i;
  time += dt; stepTweens(dt);
  for (i = parts.length - 1; i >= 0; i--) { var p = parts[i]; p.life += dt; if (p.life > p.max) { parts.splice(i, 1); continue; } p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.vx *= .985; }
  hover = null;
  if (drag) {
    var w = rayPlane(drag.p.x, drag.p.y - 46, .4), bd = 1.05;
    cells.forEach(function (c) { if (c.tiles.length) return; var d = Math.hypot(c.x - w.x, c.z - w.z); if (d < bd) { bd = d; hover = c; } });
    var tx = hover ? hover.x : w.x, tz = hover ? hover.z : w.z;
    drag.slot.tiles.forEach(function (t, j) {                              // upper tiles lag behind: the stack bends as it moves
      var k = Math.min(1, dt * (34 - j * 3.2)); t.x += (tx - t.x) * k; t.z += (tz - t.z) * k; t.y = TH * (j + .5) + drag.lift;
    });
  }
  var hc = hint && state === 'play' && !drag ? hint.cell : null;
  for (i = 0; i < cells.length; i++) { var c = cells[i], target = c === hover ? 1 : c === hc ? .45 + Math.sin(time * 6) * .25 : 0; c.hl += (target - c.hl) * Math.min(1, dt * 14); }
  if (state === 'play' && !drag) {
    if (hint) hint.t += dt;
    else if (time - lastInput > (moves === 0 ? 1 : CFG.hintDelay)) { hint = bestMove(); if (hint) { hint.t = 0; track('hint_shown', { slot: hint.slot.i, cell: hint.cell.i }); } }
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(.034, (now - lastT) / 1000 || 0); lastT = now;
  if (paused) return;
  update(dt); render3D(); renderUI();
  if (DEBUG) {
    fps += ((dt > 0 ? 1 / dt : 60) - fps) * .05; dbgT += dt;
    if (dbgT > .25) { dbgT = 0; dbgEl.textContent = 'fps ' + fps.toFixed(0) + '  variant ' + VKEY + '  state ' + state + '  score ' + score + '/' + CFG.goal + '  moves ' + moves + '\n' + EVENTS.slice(-6).map(function (e) { return JSON.stringify(e); }).join('\n'); }
  }
}

// ───────────────────────── boot ─────────────────────────
if (DEBUG) dbgEl.style.display = 'block';
if (Q.get('back') === '1') document.getElementById('back').style.display = 'block';   // demo-site navigation, never shown in an ad build
// ───────────────────────── sound unlock + mute ─────────────────────────
// Browsers only start audio from a tap. A drag does not count on phones, so every input event tries to unlock,
// and the sound button gives a guaranteed tap (it doubles as a mute toggle).
var sndEl = document.getElementById('snd'), muted = false, audible = false;
function unlockAudio() { audioInit(); if (AC && AC.state !== 'running' && !paused) { try { AC.resume(); } catch (_) {} } }
['pointerdown', 'pointerup', 'touchstart', 'touchend', 'mousedown', 'click', 'keydown'].forEach(function (ev) { window.addEventListener(ev, unlockAudio, true); });
sndEl.addEventListener('click', function () {
  if (audible || muted) muted = !muted;
  if (master) master.gain.value = muted ? 0 : .5;
  if (!muted) tone(660, .12, 'sine', .2, 990);
  track('sound', { muted: muted });
});
var quiet = 0;
setInterval(function () {
  var running = !!AC && AC.state === 'running';
  audible = running && !muted;
  quiet = interacted && !running ? quiet + 250 : 0;                        // only ask for a tap if audio really failed to start
  sndEl.textContent = muted ? '\uD83D\uDD07' : quiet >= 1500 ? '\uD83D\uDD07 Tap for sound' : '\uD83D\uDD0A';
}, 250);
if (hostAudio()) audioInit();
window.__playable = { audio: function () { return AC ? AC.state : "none"; }, events: EVENTS, best: function () { var b = bestMove(); return b ? { slot: b.slot.i, cell: b.cell.i } : null; },
  place: function (si, ci) { if (state === 'play' && slots[si].tiles.length && !cells[ci].tiles.length) { place(slots[si], cells[ci]); return true; } return false; },
  info: function () { return { state: state, score: score, moves: moves, slots: slots.map(function (s) { return s.tiles.map(function (t) { return t.c; }).join(''); }), cells: cells.map(function (c) { return c.tiles.map(function (t) { return t.c; }).join(''); }) }; } };
if (!gl) { document.body.innerHTML = '<p style="color:#fff;font:16px system-ui;padding:24px">WebGL is not available on this device.</p>'; return; }
initGL(); build(); window.addEventListener('resize', resize); resize();
Net.ready(function () {
  track('ready');
  Net.onViewable(function (v) { paused = !v; if (AC) { if (paused) AC.suspend(); else AC.resume(); } lastT = performance.now(); });
  start(); requestAnimationFrame(frame);
});
})();
</script>
