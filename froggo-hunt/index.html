<script>
/* Froggo Hunt — hidden-object playable ad demo.
   One file, no libraries, no image or audio assets: the whole illustrated scene is drawn in code.
   URL params:  ?v=a|b  creative variant     ?debug=1  FPS + event log overlay                    */
(function () {
'use strict';

// ───────────────────────── config ─────────────────────────

var VARIANTS = {
  a: { cta: 'PLAY NOW',      count: 8, time: 50, hintDelay: 7, dusk: false },

};
var VKEY = (Q.get('v') || 'a').toLowerCase(); if (!VARIANTS[VKEY]) VKEY = 'a';
var CFG = VARIANTS[VKEY];
var DEBUG = Q.get('debug') === '1';
var STORE_URL = 'https://example.com/store';            // replaced per campaign
var VW = 360, VH = 640;                                 // virtual screen
var WW = 540, WH = 760;                                 // scene (world) size
var ZMIN = Math.max(VW / WW, VH / WH), ZMAX = 2.2;
var HUD_H = 100, TRAY_Y = 520;

var INK = '#2f3e46', PAPER = '#fbf1dc', LEAF = '#8ecf7a', GREEN_D = '#5fae6b', PAD = '#a8dc7a', GREY = '#c9c3b5',
    ROOF1 = '#f6b26b', ROOF2 = '#ef8a6f', WALL1 = '#fff6e3', WALL2 = '#fde2c4', WINDOW = '#8fc4dc', PINK = '#f7a8b8',
    WOOD = '#c99a6b', FROG = '#7ed957', BELLY = '#d8f5a2';

// hiding spots, easiest first
var SPOTS = [
  { x: 462, y: 474, s: 1.05, c: GREEN_D, type: 'bush' },
  { x: 372, y: 556, s: .95,  c: GREY,    type: 'rock' },
  { x: 188, y: 530, s: .85,  c: PAD,     type: 'lily' },
  { x: 405, y: 253, s: .9,   c: ROOF2,   type: 'roof' },
  { x: 205, y: 186, s: 1,    c: '#ffffff', type: 'cloud' },
  { x: 306, y: 283, s: .95,  c: LEAF,    type: 'tree' },
  { x: 120, y: 389, s: .95,  c: WINDOW,  type: 'window' },
  { x: 262, y: 374, s: .85,  c: PINK,    type: 'laundry' }
];

// ───────────────────────── analytics ─────────────────────────
var T0 = performance.now(), EVENTS = [];
function track(name, data) {
  var e = { e: name, t: Math.round(performance.now() - T0), v: VKEY }, k;
  if (data) for (k in data) e[k] = data[k];
  EVENTS.push(e);
  try { if (parent !== window) parent.postMessage({ playable: e }, '*'); } catch (_) {}
}

// ───────────────────────── ad network adapter ─────────────────────────
var Net = {
  ready: function (cb) {
    var m = window.mraid;
    if (m && m.getState && m.getState() === 'loading') m.addEventListener('ready', cb); else cb();
    try { if (window.gameReady) window.gameReady(); } catch (_) {}        // Mintegral
  },
  onViewable: function (cb) {
    var m = window.mraid;
    if (m && m.addEventListener) m.addEventListener('viewableChange', cb);
    document.addEventListener('visibilitychange', function () { cb(!document.hidden); });
  },
  end: function () { try { if (window.gameEnd) window.gameEnd(); } catch (_) {} },
  cta: function () {
    track('cta', { found: found });
    try {
      if (window.mraid && mraid.open) return mraid.open(STORE_URL);        // AppLovin, Unity, ironSource
      if (window.FbPlayableAd) return FbPlayableAd.onCTAClick();           // Meta
      if (window.ExitApi) return ExitApi.exit();                           // Google
      if (window.dapi && dapi.openStoreUrl) return dapi.openStoreUrl();    // ironSource DAPI
      if (typeof window.install === 'function') return window.install();   // Mintegral
    } catch (_) {}
    toast('CTA fired → store redirect (demo build)');
  }
};

// ───────────────────────── canvas ─────────────────────────
var cv = document.getElementById('c'), screenCtx = cv.getContext('2d'), g = screenCtx;
var W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  S = Math.min(W / VW, H / VH); OX = (W - VW * S) / 2; OY = (H - VH * S) / 2;
}
window.addEventListener('resize', resize); resize();

// ───────────────────────── tweens ─────────────────────────
var E = {
  lin: function (k) { return k; },
  out: function (k) { return 1 - Math.pow(1 - k, 3); },
  inOut: function (k) { return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; },
  back: function (k) { var s = 1.70158; k -= 1; return k * k * ((s + 1) * k + s) + 1; },
  elastic: function (k) { return k === 0 || k === 1 ? k : Math.pow(2, -10 * k) * Math.sin((k - .075) * 2 * Math.PI / .3) + 1; },
  bounce: function (k) {
    var n = 7.5625, d = 2.75;
    if (k < 1 / d) return n * k * k;
    if (k < 2 / d) return n * (k -= 1.5 / d) * k + .75;
    if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + .9375;
    return n * (k -= 2.625 / d) * k + .984375;

var tweens = [];
function tw(o, to, d, ease, delay, done) { tweens.push({ o: o, to: to, d: d, e: ease || E.out, t: -(delay || 0), done: done, f: null, dead: 0 }); }
function after(sec, fn) { tw({}, {}, sec, E.lin, 0, fn); }
function kill(o) { for (var i = 0; i < tweens.length; i++) if (tweens[i].o === o) tweens[i].dead = 1; }
function stepTweens(dt) {
  for (var i = 0; i < tweens.length; i++) {
    var t = tweens[i], p; if (t.dead) continue;
    t.t += dt; if (t.t < 0) continue;
    if (!t.f) { t.f = {}; for (p in t.to) t.f[p] = t.o[p]; }

// ───────────────────────── audio (synthesized) ─────────────────────────
var AC = null, master = null;

  ribbit: function (n) { tone(150, .09, 'sawtooth', .13, 320); tone(180, .13, 'sawtooth', .13, 420, .1); tone(784 + n * 70, .22, 'triangle', .22, 0, .08); tone(1175 + n * 70, .25, 'triangle', .16, 0, .16); },

  tick: function () { tone(1100, .04, 'square', .05); },
  win: function () { [523, 659, 784, 1047, 1319, 1568].forEach(function (f, i) { tone(f, .35, 'triangle', .22, 0, i * .09); tone(f / 2, .35, 'sine', .15, 0, i * .09); }); },
  lose: function () { [392, 330, 262].forEach(function (f, i) { tone(f, .3, 'triangle', .2, 0, i * .16); }); },
  star: function (i) { tone(880 + i * 220, .25, 'sine', .3, 1320 + i * 330); }
};

// ───────────────────────── state ─────────────────────────
var frogs = SPOTS.slice(0, CFG.count).map(function (s, i) { return { i: i, x: s.x, y: s.y, s: s.s, c: s.c, type: s.type, found: false, pop: 1, hop: 0, ring: 0, tray: 0 }; });
var found = 0, misses = 0, state = 'boot', time = 0, paused = false, lastInput = 0, playT = 0, timeLeft = CFG.time, lastTick = 99;
var interacted = false, zoomTracked = false;
var cam = { x: 130, y: 360, z: 1.5 };
var hint = null, banner = { a: 0, s: 1, txt: '', sub: '' };
var end = { on: false, a: 0, win: true, t: 0, stars: [{ s: 0 }, { s: 0 }, { s: 0 }] };
var parts = [], texts = [], marks = [], toastMsg = { txt: '', a: 0 }, hintBtn = { s: 1 };

function clampCam() {
  cam.z = Math.max(ZMIN, Math.min(ZMAX, cam.z));
  var hw = VW / 2 / cam.z, hh = VH / 2 / cam.z;
  cam.x = Math.max(hw, Math.min(WW - hw, cam.x)); cam.y = Math.max(hh, Math.min(WH - hh, cam.y));
}
function w2v(x, y) { return { x: (x - cam.x) * cam.z + VW / 2, y: (y - cam.y) * cam.z + VH / 2 }; }
function v2w(x, y) { return { x: (x - VW / 2) / cam.z + cam.x, y: (y - VH / 2) / cam.z + cam.y }; }
function flyTo(x, y, z, d) { kill(cam); tw(cam, { x: x, y: y, z: z }, d || .6, E.inOut); }

// ───────────────────────── drawing helpers ─────────────────────────
var FONT = '"Arial Rounded MT Bold","Baloo 2","Trebuchet MS",system-ui,sans-serif';
function ink(lw) { g.strokeStyle = INK; g.lineWidth = lw || 2; g.lineJoin = 'round'; g.lineCap = 'round'; }
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function txt(s, x, y, size, fill, stroke, lw) {
  g.font = '900 ' + size + 'px ' + FONT; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || size * .22; g.strokeText(s, x, y); }
  g.fillStyle = fill; g.fillText(s, x, y);
}
function ell(x, y, rx, ry, fill, lw) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); if (fill) { g.fillStyle = fill; g.fill(); } if (lw !== 0) { ink(lw); g.stroke(); } }
function box(x, y, w, h, fill, r) { rr(x, y, w, h, r || 0); g.fillStyle = fill; g.fill(); ink(); g.stroke(); }
function line() { g.beginPath(); g.moveTo(arguments[0], arguments[1]); for (var i = 2; i < arguments.length; i += 2) g.lineTo(arguments[i], arguments[i + 1]); ink(); g.stroke(); }
// union of circles with a single outer outline
function puff(x, y, s, list, fill) {
  var i; ink(4); g.beginPath();
  for (i = 0; i < list.length; i++) { g.moveTo(x + (list[i][0] + list[i][2]) * s, y + list[i][1] * s); g.arc(x + list[i][0] * s, y + list[i][1] * s, list[i][2] * s, 0, 7); }
  g.stroke(); g.fillStyle = fill; g.beginPath();
  for (i = 0; i < list.length; i++) { g.moveTo(x + (list[i][0] + list[i][2]) * s, y + list[i][1] * s); g.arc(x + list[i][0] * s, y + list[i][1] * s, list[i][2] * s, 0, 7); }
  g.fill();
}
var CLOUD = [[0, 0, 15], [-17, 4, 11], [17, 5, 12], [-6, -8, 11], [8, -7, 10]];
var BUSH = [[-16, 0, 13], [0, -7, 16], [16, 0, 13], [0, 3, 14]];
var FOLIAGE = [[0, 0, 30], [-26, 10, 20], [26, 10, 20], [-14, -20, 20], [15, -19, 19], [0, 18, 22]];
var seed = 7; function rnd() { seed = (seed + 0x6D2B79F5) | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

function star(x, y, r, s) {
  if (s <= 0) return;
  g.save(); g.translate(x, y); g.scale(s, s); g.rotate((1 - s) * -.8); g.beginPath();
  for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * .46 : r; g.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
  g.closePath(); g.lineJoin = 'round'; g.lineWidth = 5; g.strokeStyle = '#a85b00'; g.stroke();

}

// the frog: camouflaged (eyes shut, prop-coloured) or found (bright, awake)
function frog(x, y, s, body, awake, belly) {
  g.save(); g.translate(x, y); g.scale(s, s);
  ell(-11, 7, 5.5, 3.2, body); ell(11, 7, 5.5, 3.2, body);
  ell(-7, -8, 5.4, 5.4, body); ell(7, -8, 5.4, 5.4, body);
  ell(0, 0, 13, 9.5, body);
  g.fillStyle = body; g.beginPath(); g.arc(-7, -7, 4.2, 0, 7); g.arc(7, -7, 4.2, 0, 7); g.fill();     // merge eye bumps into body
  if (belly) { g.fillStyle = belly; g.beginPath(); g.ellipse(0, 3.5, 8, 4.8, 0, 0, 7); g.fill(); }
  ink(1.6);
  if (awake) {
    g.fillStyle = '#fff'; g.beginPath(); g.arc(-7, -8, 3.3, 0, 7); g.arc(7, -8, 3.3, 0, 7); g.fill();
    g.fillStyle = INK; g.beginPath(); g.arc(-6.6, -8, 1.7, 0, 7); g.arc(7.4, -8, 1.7, 0, 7); g.fill();
    g.beginPath(); g.arc(0, -2.5, 5, Math.PI * .12, Math.PI * .88); g.stroke();
    g.fillStyle = 'rgba(255,120,150,.55)'; g.beginPath(); g.arc(-9.5, -.5, 2, 0, 7); g.arc(9.5, -.5, 2, 0, 7); g.fill();
  } else {
    g.beginPath(); g.arc(-7, -8.5, 2.4, Math.PI * .1, Math.PI * .9); g.stroke();
    g.beginPath(); g.arc(7, -8.5, 2.4, Math.PI * .1, Math.PI * .9); g.stroke();
    g.beginPath(); g.moveTo(-2.5, -.5); g.lineTo(2.5, -.5); g.stroke();
  }
  g.restore();
}

// ───────────────────────── scene (drawn once into an offscreen canvas) ─────────────────────────
function cloud(x, y, s) { puff(x, y, s, CLOUD, '#fff'); }
function bush(x, y, s, c) { puff(x, y, s, BUSH, c || GREEN_D); }
function tree(x, y, s, c) { box(x - 6 * s, y + 14 * s, 12 * s, 62 * s, WOOD, 2); puff(x, y, s, FOLIAGE, c || LEAF); line(x - 12 * s, y - 4 * s, x - 4 * s, y + 2 * s); line(x + 10 * s, y + 8 * s, x + 16 * s, y + 2 * s); }
function flower(x, y, c) { line(x, y, x, y + 9); g.fillStyle = c; for (var i = 0; i < 5; i++) { var a = i * 1.257; g.beginPath(); g.arc(x + Math.cos(a) * 3.2, y + Math.sin(a) * 3.2, 2.6, 0, 7); g.fill(); ink(1); g.stroke(); } ell(x, y, 2, 2, '#ffd866', 1); }
function tuft(x, y) { line(x - 4, y - 5, x - 2, y); line(x, y - 8, x, y); line(x + 4, y - 5, x + 2, y); }
function rock(x, y, rx, ry) { ell(x, y, rx, ry, GREY); g.beginPath(); g.arc(x - rx * .25, y - ry * .2, rx * .5, Math.PI * 1.1, Math.PI * 1.6); ink(1.5); g.stroke(); }
function mushroom(x, y, s) { box(x - 3 * s, y, 6 * s, 9 * s, '#fff6e3', 2); g.beginPath(); g.ellipse(x, y, 10 * s, 8 * s, 0, Math.PI, 0); g.closePath(); g.fillStyle = '#ef6f6f'; g.fill(); ink(); g.stroke(); g.fillStyle = '#fff'; g.beginPath(); g.arc(x - 4 * s, y - 4 * s, 1.6 * s, 0, 7); g.arc(x + 3 * s, y - 3 * s, 1.3 * s, 0, 7); g.fill(); }
function lilypad(x, y, r, c) { g.beginPath(); g.moveTo(x, y); g.ellipse(x, y, r, r * .55, 0, .5, Math.PI * 2 - .2); g.closePath(); g.fillStyle = c || PAD; g.fill(); ink(1.6); g.stroke(); }
function house(x, y, w, h, wall, roof, peak) {

  g.beginPath(); g.moveTo(x - 14, y + 2); g.lineTo(x + w / 2, peak); g.lineTo(x + w + 14, y + 2); g.closePath(); g.fillStyle = roof; g.fill(); ink(); g.stroke();

}

function door(x, y, w, h, c) { box(x, y, w, h, c, 3); ell(x + w - 6, y + h / 2, 1.6, 1.6, '#ffd866', 1); }

function drawScene() {
  var i, sky = g.createLinearGradient(0, 0, 0, 320);

  else { sky.addColorStop(0, '#a9dcf2'); sky.addColorStop(1, '#fdf3df'); }

  [[250, 120], [270, 132], [150, 228], [372, 196]].forEach(function (b) { g.beginPath(); g.arc(b[0] - 5, b[1], 5, Math.PI * 1.15, Math.PI * 1.9); g.arc(b[0] + 5, b[1], 5, Math.PI * 1.1, Math.PI * 1.85); ink(1.6); g.stroke(); });

  [[268, 480], [285, 530], [296, 590], [290, 650], [300, 705]].forEach(function (p, k) { ell(p[0], p[1], 9 - k % 2 * 2, 4, '#e6d0a3', 1.4); });

  if (toastMsg.a > 0) { g.globalAlpha = Math.min(1, toastMsg.a); g.fillStyle = 'rgba(0,0,0,.78)'; rr(30, 470, 300, 34, 17); g.fill(); g.font = '600 12.5px system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff'; g.fillText(toastMsg.txt, 180, 487); g.globalAlpha = 1; }
}
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(.034, (now - lastT) / 1000 || 0); lastT = now;
  if (paused) return;
  update(dt); render();
  if (DEBUG) {
    fps += ((dt > 0 ? 1 / dt : 60) - fps) * .05; dbgT += dt;
    if (dbgT > .25) { dbgT = 0; dbgEl.textContent = 'fps ' + fps.toFixed(0) + '  variant ' + VKEY + '  state ' + state + '  found ' + found + '/' + frogs.length + '  zoom ' + cam.z.toFixed(2) + '\n' + EVENTS.slice(-6).map(function (e) { return JSON.stringify(e); }).join('\n'); }
  }
}

// ───────────────────────── boot ─────────────────────────
if (DEBUG) dbgEl.style.display = 'block';
window.__playable = { events: EVENTS, tapWorld: tapWorld, hint: function () { showHint(false); }, cam: cam,
  info: function () { return { state: state, found: found, timeLeft: Math.round(timeLeft), frogs: frogs.map(function (f) { return { type: f.type, x: f.x, y: f.y, found: f.found }; }) }; } };
Net.ready(function () {
  track('ready');
  Net.onViewable(function (v) { paused = !v; if (AC) { if (paused) AC.suspend(); else AC.resume(); } lastT = performance.now(); });
  start();
  requestAnimationFrame(frame);
});
})();
